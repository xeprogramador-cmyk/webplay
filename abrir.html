<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrir no WebPlay</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0F;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
 a{display:inline-block;margin:8px;padding:12px 22px;border-radius:28px;background:#FFC400;color:#000;font-weight:700;text-decoration:none}
 a.sec{background:#222;color:#FFC400}
 p{color:#9AA0A6}
</style>
</head>
<body>
<div>
 <h2>A abrir no WebPlay…</h2>
 <p>Se o app estiver instalado, abre sozinho. Senão, vais para a página de download.</p>
 <a id="app" href="#">Abrir no app</a>
 <a id="apk" class="sec" href="#">Baixar o app</a>
</div>
<script>
/* ====== CONFIGURA AQUI ====== */
var SITE = "https://webplay.ct.ws";          // endereço do site
var PAGINA_APK = "https://appplay.loveslife.biz/";   // página de download do APK
var PACOTE = "com.webplay.app";
/* ============================ */

/* Uso: partilha  https://webplay.ct.ws/abrir.html?p=/caminho/do/titulo
   (p = caminho ou link do site; sem p, abre a página inicial) */
var p = new URLSearchParams(location.search).get("p") || "/";
var destino;
try { destino = new URL(p, SITE); } catch (e) { destino = new URL("/", SITE); }
if (destino.host !== new URL(SITE).host) destino = new URL("/", SITE);   // só links do próprio site

var ehAndroid = /android/i.test(navigator.userAgent);
var intentUrl = "intent://" + destino.host + destino.pathname + destino.search + destino.hash +
  "#Intent;scheme=https;package=" + PACOTE +
  ";S.browser_fallback_url=" + encodeURIComponent(PAGINA_APK) + ";end";

document.getElementById("apk").href = PAGINA_APK;
document.getElementById("app").href = ehAndroid ? intentUrl : destino.href;

if (ehAndroid) {
  location.href = intentUrl;                      // abre o app; se não houver, vai para PAGINA_APK
} else {
  location.href = destino.href;                   // PC/iPhone: abre o site normal
}
</script>
</body>
</html>
