<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reels Play</title>
<!-- ============================================================
  REELS PLAY — filminhos / novelinhas, no layout e nas cores do site.
  Topo: faixa de "stories" (recém-lançados + populares) · banner grande (os MAIS ASSISTIDOS)
  Gêneros (filtro) · abas Novos / Populares / Favoritos / A continuar · grade de capas.
  Leitor vertical com favorito, estrelas, comentários e gênero.
  Ícone de casa (sem cor) e puxar para baixo voltam à página inicial do site.
  Firebase só do Reels: ver reels-firebase.js
============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="reels-firebase.js"></script>
<style>
:root{--bg:#0d0f14;--panel:#161a22;--ink:#eae6dd;--muted:#8a8f9c;--accent:#e0a33c;--line:#232833}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hs{display:flex;overflow-x:auto;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
/* ---------- início ---------- */
#inicio{height:100%;overflow-y:auto;padding-bottom:30px;transition:transform .25s ease}
#inicio.puxa{transition:none}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.topo b{font-size:19px}.topo b span{color:var(--accent)}
.topo .casa{margin-left:auto;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.topo .casa svg{width:26px;height:26px}
.puxar{position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);padding-top:calc(env(safe-area-inset-top,0px) + 6px);opacity:0;pointer-events:none}
/* stories */
.sec{padding:2px 16px 8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.hist{gap:12px;padding:0 16px 14px}
.st{flex:0 0 auto;width:66px;text-align:center}
.st .r{width:66px;height:66px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--accent),color-mix(in srgb,var(--accent) 35%,var(--bg)),var(--accent))}
.st .r i{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);background:var(--panel) center/cover no-repeat}
.st small{display:block;margin-top:5px;font-size:10.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st em{display:inline-block;margin-top:2px;font-style:normal;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--bg)}
/* banner grande: mais assistidos */
.ban{scroll-snap-type:x mandatory;gap:10px;padding:0 16px 8px}
.hero{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:20px;overflow:hidden;min-height:220px;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,transparent 78%),linear-gradient(transparent 40%,var(--bg))}
.hero .t{position:relative;padding:18px;max-width:68%;display:flex;flex-direction:column;gap:7px;min-height:220px;justify-content:flex-end}
.hero .t small{color:var(--accent);font-weight:800;font-size:11.5px;letter-spacing:.4px}
.hero .t h3{font-size:17px;line-height:1.2}
.hero .t p{font-size:12.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:700}
.meta .es{display:flex;align-items:center;gap:3px;color:var(--accent)}.meta svg{width:14px;height:14px}
.btn-ver{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:800;font-size:13px}
.pts{display:flex;justify-content:center;gap:5px;padding-bottom:12px}.pts i{width:6px;height:6px;border-radius:50%;background:var(--line)}.pts i.on{background:var(--accent);width:16px;border-radius:4px}
/* gêneros + abas */
.chips{gap:8px;padding:0 16px 10px}
.chips button{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12.5px}
.chips button.on{border-color:var(--accent);color:var(--accent)}
.abas{gap:8px;padding:0 16px 12px}
.abas button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px}
.abas button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:0 16px}
@media(min-width:640px){.grade{grid-template-columns:repeat(5,1fr)}}
.cp{min-width:0;text-align:left}
.cp .c{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.cp .c em{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--accent);opacity:.92}
.cp .c b{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:2px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--bg);color:var(--accent);opacity:.92}
.cp .c b svg{width:10px;height:10px;fill:currentColor;stroke:none}
.cp .c .co{position:absolute;right:6px;top:6px;color:var(--accent);width:18px;height:18px}
.cp .n{margin-top:6px;font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp .g{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .p{height:3px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.cp .p i{display:block;height:100%;background:var(--accent)}
.vazio{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
/* ---------- leitor vertical ---------- */
#leitor{position:fixed;inset:0;z-index:30;background:var(--bg);display:none}
#leitor.on{display:block}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;display:flex;flex-direction:column}
.fundo{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(26px) brightness(.4);transform:scale(1.2)}
.palco{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:64px 12px 8px;min-height:0}
.cartao{position:relative;width:100%;max-width:520px;aspect-ratio:9/12;max-height:100%;border-radius:18px;overflow:hidden;background:#000 center/cover no-repeat;border:1px solid var(--line)}
.cartao iframe,.cartao video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.play i{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--bg) 70%,transparent);border:2px solid var(--accent);display:grid;place-items:center}
.play i:after{content:"";border-left:21px solid var(--accent);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.lado{position:absolute;right:10px;bottom:170px;display:flex;flex-direction:column;gap:12px;z-index:6;align-items:center}
.lado button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800}
.lado button i{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);display:grid;place-items:center}
.lado button.on{color:var(--accent)}.lado button.on svg{fill:var(--accent)}
.info{position:relative;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,var(--bg) 45%)}
.criador{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.gen{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}.gen span{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.sin{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sin.aberta{-webkit-line-clamp:unset;max-height:22vh;overflow:auto;display:block}
.partes{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.partes::-webkit-scrollbar{display:none}
.partes button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700}
.partes button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.partes.muitas{flex-wrap:wrap;max-height:104px;overflow-x:hidden;overflow-y:auto;gap:6px;scrollbar-width:thin;overscroll-behavior:contain}
.partes.muitas button{min-width:44px;padding:7px 0;text-align:center}
.nparts{font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}
.barra{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:40;display:none;justify-content:space-between;pointer-events:none}
#leitor.on ~ .barra{display:flex}
.barra button{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;color:var(--ink);filter:drop-shadow(0 1px 3px #000)}
.barra button svg{width:26px;height:26px}

/* ---------- leitor: direção, aba Início, definições, aviso ---------- */
#feed.h{display:flex;flex-direction:row;overflow-y:hidden;overflow-x:auto;scroll-snap-type:x mandatory}
#feed.h .reel{flex:0 0 100%;width:100%}
.barra .dir{display:flex;gap:2px}
#abaInicio{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:41;display:none;flex-direction:column;align-items:center;gap:6px;padding:12px 7px;border-radius:0 14px 14px 0;background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);border-left:0;color:var(--ink);backdrop-filter:blur(6px)}
#abaInicio span{writing-mode:vertical-rl;font-size:11px;font-weight:800;letter-spacing:.5px}
#abaInicio svg{width:20px;height:20px}
#leitor.on ~ #abaInicio{display:flex}
.topo #casa{margin-left:0}.topo #defs0{margin-left:auto}
.topo .casa svg{width:24px;height:24px}
.def{margin-bottom:16px}.def h5{font-size:11.5px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.def .seg{display:flex;gap:8px}.def .seg button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.def .seg button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.def small{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.3}
#aviso{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:55;display:none;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;line-height:1.3}
#aviso.on{display:flex}#aviso span{flex:1}
#aviso button{font-weight:800;font-size:12px;color:var(--accent);padding:6px 8px;white-space:nowrap}
#aviso button.n{color:var(--muted)}

.serie{overflow-y:auto;flex:1;min-height:0}
.serie .cv{width:100%;aspect-ratio:16/10;border-radius:14px;background:var(--panel) center/cover no-repeat;border:1px solid var(--line);position:relative;overflow:hidden}
.serie .cv:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg))}
.serie h3{font-size:17px;margin:10px 0 4px}
.serie .gen{margin:6px 0}
.serie p{font-size:13px;line-height:1.4;color:var(--ink);opacity:.9;margin:6px 0}
.serie .eu{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700}
.serie .eu button{padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:800;font-size:12.5px;white-space:nowrap}
.serie .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;padding-bottom:6px}
.serie .eps button{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;color:var(--muted)}
.serie .eps button.v{color:var(--ink)}.serie .eps button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.serie h5{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 7px}

#capaVer{position:fixed;inset:0;z-index:80;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#capaVer.on{display:flex}#capaVer img{max-width:100%;max-height:82%;border-radius:14px;object-fit:contain}
#capaVer span{color:var(--muted);font-size:12px}
.serie .cv .t{position:absolute;left:12px;bottom:12px;z-index:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.serie .cv .t small{font-size:10.5px;color:var(--ink);opacity:.8}
.serie .coms{overflow:visible;max-height:none;flex:none}

.chipserie{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;margin-bottom:8px;border-radius:14px;background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);text-align:left;max-width:100%;backdrop-filter:blur(6px)}
.chipserie .mini{flex:0 0 auto;width:38px;height:52px;border-radius:8px;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.chipserie .tx{display:flex;flex-direction:column;min-width:0;gap:1px}
.chipserie small{font-size:9.5px;font-weight:800;letter-spacing:.6px;color:var(--accent)}
.chipserie b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipserie em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* folha (comentários / estrelas) */
#folha{position:fixed;inset:0;z-index:60;display:none;background:#0008}
#folha.on{display:block}
#folha .f{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
#folha h4{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
#folha h4 button{color:var(--muted)}
.coms{overflow-y:auto;flex:1;min-height:120px;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.com b{font-size:12.5px;color:var(--accent)}.com small{color:var(--muted);font-size:10.5px;margin-left:6px}
.com p{font-size:13.5px;line-height:1.35;margin-top:2px;word-break:break-word}
.env{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.env input,.env textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;resize:none}
.env button{align-self:flex-end;padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:800;font-size:13px}
.estrelas{display:flex;justify-content:center;gap:10px;padding:10px 0}
.estrelas button{color:var(--muted)}.estrelas button svg{width:38px;height:38px}
.estrelas button.on{color:var(--accent)}.estrelas button.on svg{fill:var(--accent)}
.media{text-align:center;color:var(--muted);font-size:13px;padding-bottom:6px}

/* ===== v2: layout da referência (abas, nav inferior, grade em colunas) e player limpo ===== */
#inicio{padding-bottom:88px}
.busca{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted)}
.busca svg{width:18px;height:18px;flex:0 0 auto}.busca input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:13.5px}
.topo .casa{margin-left:0!important}
.tabs{gap:20px;padding:2px 16px 12px}.tabs button{flex:0 0 auto;font-weight:800;font-size:15px;color:var(--muted);padding-bottom:4px;border-bottom:2px solid transparent}.tabs button.on{color:var(--ink);border-color:var(--accent)}
.hero,.hero .t{min-height:300px}.hero .t{max-width:100%}
.fila{gap:10px;padding:0 16px 14px}.fila .cp{flex:0 0 31%}
.cp .c em{top:6px;bottom:auto;left:6px;background:var(--accent);color:var(--bg);border-radius:6px;opacity:1}
.mas{display:flex;gap:10px;padding:0 16px;align-items:flex-start}.mas>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.mas .cp:nth-child(odd) .c{aspect-ratio:3/4.3}.mas .cp:nth-child(even) .c{aspect-ratio:1/1.05}.mas>.vazio{width:100%}
.rank{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px}.rank h4{text-align:center;color:var(--accent);font-size:15px;margin-bottom:8px}
.rk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:8px}.rk .nr{font-weight:800;font-size:18px;color:var(--accent);width:14px}
.rk i{flex:0 0 38px;height:52px;border-radius:7px;background:var(--bg) center/cover no-repeat}.rk .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.rk b{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rk em{font-style:normal;font-size:10.5px;color:var(--muted)}
.rank .mais{width:100%;padding:9px;border-radius:10px;background:var(--accent);color:var(--bg);font-weight:800;font-size:13px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom,0px) + 6px);background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted)}#nav button.on{color:var(--accent)}
#leitor.on ~ #abaInicio{display:none!important}
.palco{position:absolute;inset:0;padding:0}.cartao{max-width:none;width:100%;height:100%;aspect-ratio:auto;max-height:none;border-radius:0;border:0}.fundo{display:none}
.escudo{position:absolute;left:0;right:0;top:0;z-index:4;height:calc(env(safe-area-inset-top,0px) + 76px);background:linear-gradient(#000d,transparent);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 100px 0 56px;font-weight:800;font-size:15px;text-shadow:0 1px 4px #000;color:#fff}
.escudo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{position:absolute;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 66px);background:linear-gradient(transparent,#000d 50%)}
.info .gen,.info .nparts{display:none}.sin{-webkit-line-clamp:1}
.partes.muitas{flex-wrap:nowrap;max-height:none;overflow-x:auto;overflow-y:hidden}.partes.muitas button{min-width:0;padding:7px 14px}
.lado{bottom:calc(env(safe-area-inset-bottom,0px) + 210px)}
.prog{position:absolute;left:0;right:0;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);height:3px;background:#fff3}.prog i{display:block;height:100%;width:0;background:var(--accent)}

/* ao reproduzir: só o vídeo (elementos da série somem) */
.escudoB{display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;height:calc(env(safe-area-inset-bottom,0px) + 70px);background:linear-gradient(transparent,#000 35%)}
#leitor.limpo ~ #aviso{display:none!important}
#leitor.limpo .lado,#leitor.limpo .escudo span{display:none}
#leitor.limpo .escudoB{display:block}#leitor.limpo .escudo{background:linear-gradient(#000 75%,transparent)}
#leitor.limpo ~ .barra .dir,#leitor.limpo ~ #nav{display:none}
#leitor.limpo .prog{bottom:calc(env(safe-area-inset-bottom,0px) + 4px)}

.mas.pag{display:block}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-bottom:8px}

<script>
const URL_REELS_JSON="reels.json", NO_CATALOGO="reels_catalogo", NO_STATS="reels_stats", NO_COMS="reels_comentarios";
// chaves do localStorage SEM "fav/assist/vist/histor/continu" no nome (o app lê essas à parte)
const K_CURT="wpr_curt", K_RETOMA="wpr_retoma", K_UID="wpr_uid", K_VOTOS="wpr_estr", K_CV="wpr_cv", K_NOME="wpr_nome";
let reels=[],aba="pop",gen="",lista=[],stats={};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== tema do site ===== */
function temaDoSite(){
  try{const cs=getComputedStyle(parent.document.documentElement),r=document.documentElement.style;
    ["--bg","--panel","--ink","--muted","--accent","--line"].forEach(v=>{const x=cs.getPropertyValue(v).trim();if(x)r.setProperty(v,x);});}catch(e){}
}
temaDoSite();setInterval(temaDoSite,1500);

/* ===== ícones (só contorno, sem cor própria) ===== */

function normalizar(r){
  const partes=(r.partes||[]).map((p,i)=>({parte:p.parte||i+1,link:seg(p.link),embed:seg(p.embed)})).filter(p=>p.link);
  let g=r.generos||r.genero||[];if(typeof g==="string")g=g.split(/[,;]/);
  g=(Array.isArray(g)?g:Object.values(g||{})).map(x=>String(x).trim()).filter(Boolean).slice(0,5);
  return {id:String(r.id||r.sinopse||Math.random()),sinopse:String(r.sinopse||""),capa:(DEMO&&/^data:image\//.test(r.capa||""))?r.capa:seg(r.capa),criador:String(r.criador||""),partes,generos:g,criadoEm:r.criadoEm||0,fim:!!(r.fim||r.concluido)};
}
function mesclar(l){const m=new Map();l.forEach(r=>{const n=normalizar(r);if(n.partes.length)m.set(n.id,n);});return [...m.values()].sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));}
const tituloDe=r=>{const t=(r.sinopse||"").split(/[.!?\n]/)[0].trim();return t.length>34?t.slice(0,32)+"…":(t||("Reels de "+(r.criador||"Play")));};
const st=id=>stats[id]||{};
const views=id=>+st(id).views||0;
const media=id=>{const s=st(id);return s.n>0?(s.soma/s.n):0;};
const pop=id=>views(id)+5*(+st(id).n||0)+3*(+st(id).c||0);
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);

function enviarApp(){
  try{
    const B=window.WebPlayBridge||(parent&&parent.WebPlayBridge);if(!B||!B.salvar)return;
    const mk=(r,sub)=>({titulo:tituloDe(r),capa:r.capa,url:"/?reels="+encodeURIComponent(r.id),sub});
    const fav=curtidos().map(id=>reels.find(r=>r.id===id)).filter(Boolean).map(r=>mk(r,r.partes.length+" partes"));
    const rt=retoma(),vis=Object.keys(rt).sort((a,b)=>rt[b].t-rt[a].t).map(id=>reels.find(r=>r.id===id)).filter(Boolean).map(r=>mk(r,"Parte "+(r.partes[rt[r.id].k]||r.partes[0]).parte));
    if(fav.length)B.salvar("reels_favoritos",JSON.stringify(fav));
    if(vis.length)B.salvar("reels_vistos",JSON.stringify(vis));
  }catch(e){}
}

function desenharStories(){
  const agora=Date.now(),sete=7*864e5;
  const novos=reels.filter(r=>agora-(r.criadoEm||0)<sete).slice(0,8);
  const pops=[...reels].sort((a,b)=>pop(b.id)-pop(a.id)).filter(r=>pop(r.id)>0).slice(0,8);
  const seen=new Set(),its=[];
  novos.forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);its.push({r,t:"NOVO"});}});
  pops.forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);its.push({r,t:"EM ALTA"});}});
  if(!its.length)reels.slice(0,10).forEach(r=>its.push({r,t:""}));
  $("blocoHist").style.display=its.length?"":"none";
  stories=its.map(x=>x.r);
  $("hist").innerHTML=its.map(x=>`<button class="cp" data-hist="${esc(x.r.id)}"><div class="c" style="${x.r.capa?`background-image:url('${esc(x.r.capa)}')`:""}"><em>${x.t||x.r.partes.length+" partes"}</em></div><div class="n">${esc(tituloDe(x.r))}</div>${x.r.generos.length?`<div class="g">${esc(x.r.generos.join(" · "))}</div>`:""}</button>`).join("");
}

function desenharGeneros(){
  const c={};reels.forEach(r=>r.generos.forEach(g=>{const k=g.toLowerCase();c[k]=c[k]||{nome:g,n:0};c[k].n++;}));
  const ls=Object.values(c).sort((a,b)=>b.n-a.n);
  if(gen&&!ls.some(x=>x.nome.toLowerCase()===gen.toLowerCase()))gen="";
  $("chips").style.display=ls.length?"":"none";
  $("chips").innerHTML=ls.length?`<button data-g="" class="${gen?"":"on"}">Todos</button>`+ls.map(x=>`<button data-g="${esc(x.nome)}" class="${x.nome.toLowerCase()===gen.toLowerCase()?"on":""}">${esc(x.nome)}</button>`).join(""):"";
}
let q="";const semAc=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function rankHtml(){const t=[...reels].sort((a,b)=>pop(b.id)-pop(a.id)).slice(0,3);if(!t.length)return"";
  return `<div class="rank"><h4>Popular</h4>${t.map((r,i)=>`<button class="rk" data-abrir="${esc(r.id)}"><span class="nr">${i+1}</span><i style="${r.capa?`background-image:url('${esc(r.capa)}')`:""}"></i><span class="tx"><b>${esc(tituloDe(r))}</b><em>${fmt(views(r.id))} visualizações</em></span></button>`).join("")}<button class="mais">Explorar Mais</button></div>`;}
function agoTxt(t){const m=Math.round((Date.now()-t)/6e4);return m<1?"agora":m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:m<2880?"ontem":`há ${Math.round(m/1440)} dias`;}
function histHtml(base){
  const rt=retoma(),d0=new Date();d0.setHours(0,0,0,0);const hoje=d0.getTime(),D=864e5,G=[["Hoje",[]],["Ontem",[]],["Esta semana",[]],["Antes",[]]];
  base.forEach(r=>{const t=(rt[r.id]||{}).t||0;G[t>=hoje?0:t>=hoje-D?1:t>=hoje-7*D?2:3][1].push(r);});
  const li=r=>{const x=rt[r.id],n=r.partes.length,ate=Math.min(n,x.fim?x.k:x.k+1),pct=Math.round(100*ate/n);
    return `<div class="hi"><button class="hb" data-abrir="${esc(r.id)}"><i style="${r.capa?`background-image:url('${esc(r.capa)}')`:""}"></i><span class="tx"><b>${esc(tituloDe(r))}</b><em>Parou no EP ${ate} de ${n} · ${agoTxt(x.t)}</em><span class="pgb"><i style="width:${pct}%"></i></span></span></button><button class="hx" data-rm="${esc(r.id)}" aria-label="Remover do histórico"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;};
  return base.length?`<button class="limp" data-limpar>Limpar histórico</button>`+G.map(g=>g[1].length?`<div class="sec" style="padding-left:0">${g[0]}</div>`+g[1].map(li).join(""):"").join(""):"";
}

  const c=e.target.closest("[data-limpar]");

    gravarLS(K_RETOMA,{});gravarLS("wpr_tempo",{});enviarApp();desenharInicio();}
});
function cartao(r,cur,rt,n){const prog=aba==="cont"&&rt[r.id]?Math.round(((rt[r.id].k+1)/r.partes.length)*100):0,m=media(r.id);
  return `<button class="cp" data-abrir="${esc(r.id)}"><div class="c" style="${r.capa?`background-image:url('${esc(r.capa)}')`:""}">${cur.includes(r.id)?IC_CORACAO:""}<em>${r.partes.length} ${r.partes.length>1?"partes":"parte"}</em><b>${IC_PLAY}${fmt(views(r.id))}</b>${n?`<span class="num${n<=3?" t":""}">${n}</span>`:""}</div><div class="n">${esc(tituloDe(r))}</div>${r.generos.length?`<div class="g">${esc(r.generos.join(" · "))}</div>`:""}${prog?`<div class="p"><i style="width:${prog}%"></i></div>`:""}</button>`;}
function secao(t,its,cur,rt){return its.length?`<div class="sec" style="padding-left:0">${t}</div>${grade3(its,cur,rt)}`:"";}
function grade3(its,cur,rt,numerar){return `<div class="g3c">${its.map((r,i)=>cartao(r,cur,rt,numerar?i+1:0)).join("")}</div>`;}
function masonry(base,cur,rt,comRank){   // 2 colunas como na referência; o cartão "Popular" abre a coluna da direita
  const A=[],B=[];let ha=0,hb=0;
  if(comRank){const rk=rankHtml();if(rk){B.push(rk);hb=1.05;}}
  base.forEach(r=>{if(ha<=hb){A.push(cartao(r,cur,rt));ha++;}else{B.push(cartao(r,cur,rt));hb++;}});
  return `<div class="mc"><div class="col">${A.join("")}</div><div class="col">${B.join("")}</div></div>`;
}
function desenharInicio(){
  const L=aba==="fav"||aba==="cont"||aba==="hist",ok=r=>(!gen||r.generos.some(g=>g.toLowerCase()===gen.toLowerCase()))&&(!q||semAc(tituloDe(r)+" "+r.sinopse+" "+r.criador+" "+r.generos.join(" ")).includes(q));
  let base=aba==="fav"?curtidos().map(id=>reels.find(r=>r.id===id)).filter(Boolean)
    :aba==="cont"||aba==="hist"?Object.entries(retoma()).sort((a,b)=>b[1].t-a[1].t).map(([id])=>reels.find(r=>r.id===id)).filter(Boolean)
    :aba==="pop"?[...reels].sort((a,b)=>pop(b.id)-pop(a.id))
    :aba==="class"?[...reels].sort((a,b)=>media(b.id)-media(a.id)||pop(b.id)-pop(a.id)):reels;
  base=base.filter(ok);lista=base;
  desenharBanner();desenharGeneros();
  const home=aba==="pop"&&!q,mas=(!!q||L||aba==="pop")&&aba!=="hist";$("inicio").classList.toggle("home",home);
  if(!home)$("blocoHist").style.display=$("blocoBan").style.display="none";
  if(aba!=="cat"||q)$("chips").style.display="none";
  const rt=retoma(),cur=curtidos(),ag=Date.now(),D=864e5;let out="";
  if(aba==="hist")out=histHtml(base);
  else if(mas){out=L?grade3(base,cur,rt):masonry(base,cur,rt,home);}
  else if(aba==="novos")out=secao("Hoje",base.filter(r=>ag-r.criadoEm<D),cur,rt)+secao("Esta semana",base.filter(r=>{const t=ag-r.criadoEm;return t>=D&&t<7*D;}),cur,rt)+secao("Mais antigos",base.filter(r=>ag-r.criadoEm>=7*D),cur,rt);
  else if(aba==="class")out=`<div class="sec" style="padding-left:0">Mais bem classificados</div>`+grade3(base,cur,rt,true);
  else if(aba==="cat"){if(gen)out=secao(esc(gen),base,cur,rt);else{const gs={};base.forEach(r=>r.generos.forEach(g=>{(gs[g]=gs[g]||[]).push(r);}));
    out=Object.keys(gs).sort((a,b)=>gs[b].length-gs[a].length).map(g=>`<div class="sec" style="padding-left:0">${esc(g)} · ${gs[g].length}</div>${grade3(gs[g].slice(0,12),cur,rt)}`).join("");}}
  $("grade").className="mas pag";
  $("grade").innerHTML=base.length?out:`<div class="vazio">${aba==="fav"?"Toca no coração num Reels para ele aparecer aqui.":aba==="hist"?"Ainda não assististe nada. O que vires aparece aqui.":aba==="cont"?"Vê um Reels e ele aparece aqui para continuares depois.":q||gen?"Nada encontrado.":"Ainda não há Reels publicados."}</div>`;
}

  [...$("tabs").children].forEach(x=>x.classList.toggle("on",x.dataset.a===a));[...$("abas").children].forEach(x=>x.classList.toggle("on",x.dataset.a===a));

(function(){
  const ini=$("inicio");let y0=null,x0=0,dy=0,ativo=false;
  ini.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=ini.scrollTop<=0?t.clientY:null;dy=0;ativo=false;},{passive:true});
  ini.addEventListener("touchmove",e=>{
    if(y0===null)return;const t=e.touches[0];dy=t.clientY-y0;
    if(!ativo){if(dy>8&&dy>Math.abs(t.clientX-x0)*1.3&&ini.scrollTop<=0){ativo=true;ini.classList.add("puxa");}else{if(dy<-8)y0=null;return;}}
    if(e.cancelable)e.preventDefault();
    const d=Math.min(dy*0.55,200);ini.style.transform="translateY("+d+"px)";$("puxar").style.opacity=Math.min(1,d/90);
  },{passive:false});
  function fim(){
    if(!ativo){y0=null;return;}
    ativo=false;y0=null;ini.classList.remove("puxa");
    if(dy*0.55>95){ini.style.transform="translateY(100vh)";setTimeout(()=>{irParaInicio();setTimeout(()=>{ini.style.transform="";$("puxar").style.opacity=0;},500);},180);}
    else{ini.style.transform="";$("puxar").style.opacity=0;}
  }
  ini.addEventListener("touchend",fim);ini.addEventListener("touchcancel",fim);
})();

/* ===== leitor vertical ===== */
function ehDireto(u){return /\.(mp4|webm|m4v|mov|m3u8)(\?|#|$)/i.test(u);}
/* decide como tocar: vídeo direto ou iframe (YouTube, Vimeo, Drive, Dailymotion e outros embeds) */
function embedDe(p){
  const u=p.link;let m;

    if(t.closest("#smais")){const p=$("sn"),ab=p.classList.toggle("ab");$("smais").textContent=ab?"Menos":"Mais";return;}
    const l=t.closest("[data-lista2]");if(l){const on=alternarCurtir(r.id);l.classList.toggle("on",on);l.lastElementChild.textContent=on?"Na minha lista":"Adicionar à Lista";return;}
    const c=t.closest("[data-canal]");if(c){const o=lerLS(K_CANAL,{});o[ck]=!o[ck];gravarLS(K_CANAL,o);c.classList.toggle("on",o[ck]);c.textContent=o[ck]?"A seguir o canal":"Siga o nosso canal";if(o[ck]&&URL_CANAL)window.open(URL_CANAL,"_blank");return;}
    const f=t.closest("[data-fx]");if(f){[...f.parentNode.children].forEach(x=>x.classList.toggle("on",x===f));$("eps").innerHTML=eps(+f.dataset.fx);return;}
    const b=t.closest("[data-ep]");if(b){fecharFolha();iniciarSerie(r,+b.dataset.ep);return;}
    const cv=t.closest(".dcp");if(cv&&cv.dataset.capa){$("capaImg").src=cv.dataset.capa;$("capaVer").classList.add("on");}};
}
/* ao entrar: se uma série foi vista >= 15 min (ou até ao fim), segue nela; senão, um vídeo ao acaso */
function escolherInicio(){return {r:reels[Math.floor(Math.random()*reels.length)],k:0};}
function iniciarSugerido(){
  const o=escolherInicio();if(!o.r)return;
  iniciarFila(o.r,o.k,embaralhar(reels.filter(x=>x!==o.r)));
  if(cfg.aviso){$("aviso").classList.add("on");clearTimeout(iniciarSugerido.t);iniciarSugerido.t=setTimeout(()=>$("aviso").classList.remove("on"),8000);}
}
function fecharLeitor(deHistorico,semDetalhe){
  document.body.classList.remove("imersivo");
  if(!noLeitor)return;const rs=modo==="serie"?serieAtual:null;modo="para";serieAtual=null;$("leitor").classList.remove("serie");noLeitor=false;atual=null;clearTimeout(tAuto);if(obs)obs.disconnect();
  fecharFolha();$("aviso").classList.remove("on");$("leitor").classList.remove("on");$("feed").innerHTML="";fila=[];$("leitor").classList.remove("limpo");navAtivo(aba==="fav"||aba==="cont"?"lista":"inicio");desenharInicio();
  if(!deHistorico){try{if(history.state&&history.state.wprLeitor)history.back();}catch(e){}}
  if(rs&&!semDetalhe)abrirDetalhe(rs);
}
addEventListener("popstate",()=>{if(emImersivo()){imersivo(false);try{history.pushState({wprLeitor:1},"");}catch(e){}return;}if(noLeitor)fecharLeitor(true);});

$("abaInicio").onclick=()=>fecharLeitor(false,true);

/* ===== definições ===== */
function abrirDefs(){
  const seg=(k,ops)=>`<div class="seg" data-k="${k}">${ops.map(o=>`<button data-v="${o[0]}" class="${String(cfg[k])===String(o[0])?"on":""}">${o[1]}</button>`).join("")}</div>`;
  $("folhaConteudo").innerHTML=`<h4>Definições dos Reels<button data-fechar aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h4>
   <div class="def"><h5>Ao entrar nos Reels</h5>${seg("entrada",[["video","Para si (vídeos aleatórios)"],["inicio","Página inicial"]])}</div>
   <div class="def"><h5>Passar de um vídeo para o outro</h5>${seg("direcao",[["v","Na vertical ↕"],["h","Na horizontal ↔"]])}</div>
   <div class="def"><h5>Passar ao próximo quando acabar</h5>${seg("auto",[["true","Ligado"],["false","Desligado"]])}<small>Funciona com vídeos diretos (mp4/m3u8) e YouTube. No Drive e outros embeds o fim não é detetado: desliza para o próximo.</small></div>
   <div class="def"><h5>Aviso ao entrar</h5>${seg("aviso",[["true","Mostrar"],["false","Não mostrar"]])}</div>`;
  $("folha").classList.remove("det");$("folha").classList.add("on");
}
$("folhaConteudo").addEventListener("click",e=>{
  const b=e.target.closest(".def .seg button");if(!b)return;const k=b.parentNode.dataset.k,v=b.dataset.v;
  const i=noLeitor?indiceAtual():0;
  cfg[k]=(k==="auto"||k==="aviso")?v==="true":v;gravarLS(K_CFG,cfg);
  [...b.parentNode.children].forEach(x=>x.classList.toggle("on",x===b));
  if(k==="direcao"&&noLeitor){aplicarDirecao();$("feed").scrollTo({left:0,top:0});requestAnimationFrame(()=>irPara(i));}
});
$("defs").onclick=abrirDefs;$("defs0").onclick=abrirDefs;
$("avDef").onclick=()=>{$("aviso").classList.remove("on");abrirDefs();};
$("avNao").onclick=()=>{cfg.aviso=false;gravarLS(K_CFG,cfg);$("aviso").classList.remove("on");};
$("voltar").onclick=()=>{if(emImersivo()){imersivo(false);return;}fecharLeitor();};
/* ===== ecrã completo: só o botão de voltar (e o ícone para sair) ===== */
const emImersivo=()=>document.body.classList.contains("imersivo");
function imersivo(on){document.body.classList.toggle("imersivo",on);}
function alternarImersivo(){
  if(emImersivo()){imersivo(false);return;}
  if(cfg.autoPerg){imersivo(true);return;}
  $("folhaConteudo").innerHTML=`<h4>Rolar automaticamente?<button data-fechar aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h4>
   <div class="def"><small style="margin:0 0 10px">Ao acabar um vídeo, passa sozinho para o próximo (Automático) ou ficas tu a deslizar (Manual). Podes mudar isto nas definições.</small><div class="seg" data-k="auto"><button data-v="true" class="${cfg.auto?"on":""}">Automático</button><button data-v="false" class="${cfg.auto?"":"on"}">Manual</button></div></div>
   <button class="dplay" data-imers>Ativar ecrã completo</button>`;
  $("folha").classList.remove("det");$("folha").classList.add("on");
}
$("folhaConteudo").addEventListener("click",e=>{if(!e.target.closest("[data-imers]"))return;cfg.autoPerg=true;gravarLS(K_CFG,cfg);fecharFolha();imersivo(true);});
$("feed").addEventListener("click",e=>{if(emImersivo()&&e.target.closest("video")){const l=e.target.closest(".reel").querySelector(".lado");l.classList.add("mostra");setTimeout(()=>l.classList.remove("mostra"),3000);}});



/* ===== ver a série: capa, episódio em que estás, lista de episódios ===== */
function abrirSerie(reel,r){
  const k=+reel.dataset.k,rt=retoma()[r.id],vistos=rt?rt.k:0,m=media(r.id),v=views(r.id);
  $("folhaConteudo").innerHTML=`<h4>${esc(tituloDe(r))}<button data-fechar aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h4>
  <div class="serie">
   <div class="cv" data-capa="${esc(r.capa)}" style="${r.capa?`background-image:url('${esc(r.capa)}')`:""}"><div class="t"><button class="btn-ver" data-ep="${k}">${IC_PLAY} Assistir EP ${esc(r.partes[k].parte)}</button><small>Toca na capa para ver a foto</small></div></div>
   <div class="meta" style="margin-top:10px"><span>${r.partes.length} ${r.partes.length>1?"episódios":"episódio"}</span><span>${fmt(v)} visualizações</span>${m?`<span class="es">${IC_ESTP}${m.toFixed(1)}</span>`:""}<button data-aval style="margin-left:auto;color:var(--accent);font-weight:800">Avaliar</button></div>
   ${r.generos.length?`<div class="gen">${r.generos.map(g=>`<span>${esc(g)}</span>`).join("")}</div>`:""}
   ${r.criador?`<div class="criador">@${esc(r.criador)}</div>`:""}
   <p>${esc(r.sinopse)}</p>
   <div class="eu"><span>Estás no EP ${esc(r.partes[k].parte)} de ${r.partes.length}</span></div>
   <h5>Episódios</h5>
   <div class="eps">${r.partes.map((p,i)=>`<button data-ep="${i}" class="${i===k?"on":i<vistos?"v":""}">${esc(p.parte)}</button>`).join("")}</div>
   <h5>Comentários</h5>${blocoComs()}
  </div>`;
  $("folha").classList.remove("det");$("folha").classList.add("on");ligarComs(reel,r);
  $("folhaConteudo").onclick=e=>{
    if(e.target.closest("[data-aval]")){abrirEstrelas(reel,r);return;}
    const b=e.target.closest("[data-ep]");
    if(b){const kk=+b.dataset.ep,cur=[...$("feed").children].indexOf(reel);let best=-1;
      fila.forEach((x,i)=>{if(x.r===r&&x.k===kk&&(best<0||Math.abs(i-cur)<Math.abs(best-cur)))best=i;});
      fecharFolha();if(best>=0)irPara(best,true);return;}
    const cv=e.target.closest(".cv");if(cv&&cv.dataset.capa){$("capaImg").src=cv.dataset.capa;$("capaVer").classList.add("on");}
  };
}
$("capaVer").onclick=()=>{$("capaVer").classList.remove("on");$("capaImg").removeAttribute("src");};

/* ===== folha: estrelas e comentários ===== */
let comRef=null;
function fecharFolha(){$("folha").classList.remove("on","det");$("folhaConteudo").innerHTML="";if(comRef){try{comRef.off();}catch(e){}comRef=null;}}
$("folha").addEventListener("click",e=>{if(e.target===$("folha")||e.target.closest("[data-fechar]"))fecharFolha();});
function abrirEstrelas(reel,r){
  const meu=lerLS(K_VOTOS,{})[r.id]||0;
  $("folhaConteudo").innerHTML=`<h4>Avaliar este Reels<button data-fechar aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h4>
   <div class="media" id="mediaTxt"></div>
   <div class="estrelas" id="estrelas">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=meu?"on":""}" aria-label="${n} estrelas">${IC_ESTP}</button>`).join("")}</div>`;
  const txt=()=>{const s=st(r.id);$("mediaTxt").textContent=s.n>0?`${(s.soma/s.n).toFixed(1)} de 5 · ${s.n} ${s.n>1?"avaliações":"avaliação"}`:"Ainda sem avaliações — sê o primeiro.";};txt();
  $("folha").classList.remove("det");$("folha").classList.add("on");
  $("estrelas").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.n;votar(r.id,n);
    [...$("estrelas").children].forEach(x=>x.classList.toggle("on",+x.dataset.n<=n));reel.querySelector(".est").classList.add("on");
    setTimeout(()=>{if($("mediaTxt"))txt();const m=media(r.id),vm=reel.querySelector(".vm");if(vm)vm.textContent=m?m.toFixed(1):"—";},DEMO?30:700);};
}
function abrirComentarios(reel,r){
  $("folhaConteudo").innerHTML=`<h4>Comentários<button data-fechar aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h4>
   ${blocoComs()}`;
  $("folha").classList.remove("det");$("folha").classList.add("on");ligarComs(reel,r);
}
function blocoComs(){return `<div class="coms" id="coms"><div class="vazio" style="padding:20px">A carregar…</div></div>
   <div class="env"><input id="cNome" maxlength="24" placeholder="O teu nome" value="${esc(lerLS(K_NOME,""))}"><textarea id="cTxt" rows="2" maxlength="300" placeholder="Escreve um comentário…"></textarea><button id="cEnv">Enviar</button></div>`;}
function ligarComs(reel,r){
  if(DEMO){
    const ar=demoComs[r.id]=demoComs[r.id]||[{nome:"Ana",texto:"Que final!! Quero a parte 2 já.",em:Date.now()-36e5},{nome:"Rui",texto:"Muito bom, as três partes seguidas.",em:Date.now()-9e6}];
    const pinta=()=>{$("coms").innerHTML=[...ar].sort((a,b)=>b.em-a.em).map(c=>`<div class="com"><b>${esc(c.nome)}</b><small>${new Date(c.em).toLocaleDateString()}</small><p>${esc(c.texto)}</p></div>`).join("");};pinta();
    $("cEnv").onclick=()=>{const t=$("cTxt").value.trim();if(!t)return;ar.push({nome:$("cNome").value.trim()||"Anónimo",texto:t,em:Date.now()});$("cTxt").value="";stats[r.id]=stats[r.id]||{};stats[r.id].c=(stats[r.id].c||0)+1;const c=reel.querySelector(".vc");if(c)c.textContent=fmt(stats[r.id].c);pinta();};
    return;
  }
  if(!DB){$("coms").innerHTML='<div class="vazio" style="padding:20px">Comentários indisponíveis agora.</div>';return;}
  comRef=DB.ref(NO_COMS+"/"+r.id).limitToLast(60);
  comRef.on("value",s=>{const v=s.val()||{},ar=Object.values(v).sort((a,b)=>(b.em||0)-(a.em||0));
    $("coms").innerHTML=ar.length?ar.map(c=>`<div class="com"><b>${esc(c.nome||"Anónimo")}</b><small>${c.em?new Date(c.em).toLocaleDateString():""}</small><p>${esc(c.texto)}</p></div>`).join(""):'<div class="vazio" style="padding:20px">Ainda sem comentários. Sê o primeiro!</div>';});
  let ultimo=0;
  $("cEnv").onclick=()=>{
    const nome=$("cNome").value.trim().slice(0,24)||"Anónimo",texto=$("cTxt").value.trim().slice(0,300);
    if(!texto||Date.now()-ultimo<4000)return;ultimo=Date.now();gravarLS(K_NOME,nome);
    DB.ref(NO_COMS+"/"+r.id).push({nome,texto,em:Date.now(),uid}).then(()=>{
      $("cTxt").value="";
      DB.ref(NO_STATS+"/"+r.id).transaction(s=>{s=s||{};s.c=(s.c||0)+1;return s;}).catch(()=>{});
      setTimeout(()=>{const c=reel.querySelector(".vc");if(c)c.textContent=fmt(+st(r.id).c||0);},700);
    }).catch(()=>{});
  };
}

$("feed").addEventListener("click",e=>{
  const reel=e.target.closest(".reel");if(!reel)return;const r=reels.find(x=>x.id===reel.dataset.id),card=reel.querySelector(".cartao");if(!r)return;
  const bt=e.target.closest(".partes button");
  if(bt){const k=+bt.dataset.k,cur=[...$("feed").children].indexOf(reel);let best=-1;
    fila.forEach((x,i)=>{if(x.r===r&&x.k===k&&(best<0||Math.abs(i-cur)<Math.abs(best-cur)))best=i;});
    if(best>=0)irPara(best,true);return;}
  if(e.target.closest(".play")){const k=+reel.dataset.k;tocar(card,r,k);marcarVisto(r.id,k);return;}
  const c=e.target.closest(".cur");if(c){const on=alternarCurtir(r.id);document.querySelectorAll('.reel[data-id="'+CSS.escape(r.id)+'"] .cur').forEach(x=>x.classList.toggle("on",on));return;}
  if(e.target.closest(".est")){abrirEstrelas(reel,r);return;}
  if(e.target.closest(".com")){abrirComentarios(reel,r);return;}
  if(e.target.closest(".full")){alternarImersivo();return;}
  if(e.target.closest(".ser")){fecharLeitor(false,true);navAtivo("inicio");abrirDetalhe(r);return;}
  const s=e.target.closest(".sin");if(s)s.classList.toggle("aberta");
});

/* ===== carregar ===== */
let doJson=[],doFb=[];
function atualizar(){reels=mesclar(doFb.concat(doJson));if(!noLeitor)desenharInicio();enviarApp();
  if(atualizar.feito||!reels.length)return;
  const m=location.hash.match(/r=([^&]+)/);
  if(m){const id=decodeURIComponent(m[1]);if(reels.some(r=>r.id===id)){atualizar.feito=true;lista=reels;abrirLeitor(id);}}
  else if(/volta/.test(location.hash)){atualizar.feito=true;const rt=retoma(),ids=Object.keys(rt).filter(id=>reels.some(r=>r.id===id)).sort((a,b)=>(rt[b].t||0)-(rt[a].t||0));
    if(ids.length){lista=reels;abrirLeitor(ids[0]);}else iniciarSugerido();}
  else if(cfg.entrada==="video"){atualizar.feito=true;iniciarSugerido();}
  else atualizar.feito=true;}
if(DEMO){doJson=dadosDemo();atualizar();}
else fetch(URL_REELS_JSON,{cache:"no-store"}).then(r=>r.ok?r.json():[]).catch(()=>[]).then(j=>{doJson=Array.isArray(j)?j:Object.values(j||{});atualizar();});
if(DB){
  DB.ref(NO_CATALOGO).on("value",s=>{const v=s.val()||{};doFb=Object.keys(v).map(k=>Object.assign({id:k},v[k]));atualizar();});
  let tt=null;
  DB.ref(NO_STATS).on("value",s=>{stats=s.val()||{};clearTimeout(tt);tt=setTimeout(()=>{if(!noLeitor)desenharInicio();},400);});
}
desenharInicio();
</script>
</body>
